<!DOCTYPE html>
<html lang="pl"> <head>
  <meta charset="utf-8" />
  <title>Vortex Analytica — Logowanie i Rejestracja</title> <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
        content="Vortex Analytica: Zaloguj się, aby uzyskać dostęp do analiz rynkowych AI" /> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link rel="stylesheet" href="/static/css/landing_page.css" /> <link rel="stylesheet" href="/static/css/login.css" /> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* Komunikaty uwierzytelniania */
    .auth-message {
      margin-top: 15px;
      padding: 10px 15px; /* Zwiększono padding */
      border-radius: 5px;
      text-align: center;
      display: none; /* Ukryte domyślnie */
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word; /* Zapewnia zawijanie długich komunikatów */
    }

    .auth-message.error {
      background-color: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #b91c1c;
    }
    /* Poprawki dla ciemnego motywu (jeśli istnieje) */
    [data-theme="dark"] .auth-message.error {
        background-color: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
        color: #fca5a5;
    }

    .auth-message.success {
      background-color: rgba(0, 128, 0, 0.1);
      border: 1px solid rgba(0, 128, 0, 0.3);
      color: #15803d;
    }
     [data-theme="dark"] .auth-message.success {
        background-color: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.4);
        color: #86efac;
    }

    /* Indykator siły hasła */
    .password-strength-meter {
      height: 4px;
      background-color: #ddd;
      margin-top: 5px;
      border-radius: 2px;
      overflow: hidden;
    }
    [data-theme="dark"] .password-strength-meter {
       background-color: rgba(255, 255, 255, 0.1);
    }

    .strength-bar {
      height: 100%;
      width: 0;
      background-color: #ddd;
      transition: width 0.3s, background-color 0.3s;
    }

    /* Styl dla stanu ładowania przycisku (w tym społecznościowego) */
    .auth-button.loading,
    .social-btn.loading {
      position: relative; /* Potrzebne do pozycjonowania spinnera */
      cursor: wait;
      opacity: 0.7;
      color: transparent !important; /* Ukryj tekst/ikonę */
      pointer-events: none; /* Zapobiegaj wielokrotnym kliknięciom */
    }
     .social-btn.loading i:first-child { /* Ukryj oryginalną ikonę społecznościową */
      display: none;
    }

    .auth-button.loading::after,
    .social-btn.loading::after { /* Spinner */
      content: "\f110"; /* Ikona spinnera Font Awesome */
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      display: inline-block;
      animation: fa-spin 1s infinite linear;
      color: var(--button-text-color, #fff); /* Użyj zmiennej CSS lub domyślnego koloru */
      font-size: 1em; /* Dopasuj rozmiar spinnera */
      /* Pozycjonowanie spinnera na środku przycisku */
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
     [data-theme="dark"] .auth-button.loading::after,
     [data-theme="dark"] .social-btn.loading::after {
         color: var(--button-text-color-dark, #eee);
     }


  </style>
</head>

<script type="module" src="/static/js/quantum_bg.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script>
  /**
   * Skrypt dla login.html
   * Inicjalizuje Firebase, obsługuje logowanie/rejestrację,
   * wysyła token do backendu dla sesji ciasteczkowej, obsługuje OAuth.
   */
  document.addEventListener('DOMContentLoaded', () => {

    // Globalne referencje Firebase (inicjalizowane w initializeLoginAuth)
    let firebaseApp = null;
    let firebaseAuth = null;

    // Elementy DOM
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');
    const loginButton = document.getElementById('login-button');
    const loginMessageArea = document.getElementById('login-message-area');
    const regNameInput = document.getElementById('reg-name');
    const regEmailInput = document.getElementById('reg-email');
    const regPasswordInput = document.getElementById('reg-password');
    const regConfirmPasswordInput = document.getElementById('reg-confirm-password');
    const regTermsCheckbox = document.getElementById('reg-terms');
    const registerButton = document.getElementById('register-button');
    const registerMessageArea = document.getElementById('register-message-area');
    const forgotPasswordLink = document.querySelector('.forgot-password');
    const strengthBar = document.querySelector('#register-form .strength-bar');

    // Funkcja pomocnicza do pobierania wartości ciasteczka
    const getCookie = (name) => {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    };

    // Funkcja do ekstrakcji tokenu CSRF z ukrytych pól formularza
    const extractCSRFFromHTML = () => {
        // Szukaj ukrytych pól z tokenem CSRF w różnych formatach
        const csrfField = document.querySelector('input[name="csrf_token"], input[name="csrftoken"], input[name="csrf"], input[name="_csrf"], input[name="_csrf_token"]');
        
        if (csrfField) {
            console.log("Znaleziono ukryte pole CSRF w HTML:", csrfField.name);
            return csrfField.value;
        }
        
        // Szukaj tokenu w metadanych (czasami umieszczany w meta tagach)
        const csrfMeta = document.querySelector('meta[name="csrf-token"], meta[name="csrf"]');
        if (csrfMeta) {
            console.log("Znaleziono token CSRF w meta tagu:", csrfMeta.name);
            return csrfMeta.getAttribute('content');
        }
        
        console.log("Nie znaleziono tokenu CSRF w HTML");
        return null;
    };

    // Funkcja do pobierania tokenu CSRF przed logowaniem
    const fetchCSRFToken = async () => {
        try {
            // Sprawdź, czy token CSRF jest już dostępny w HTML
            const htmlToken = extractCSRFFromHTML();
            if (htmlToken) {
                console.log("Znaleziono token CSRF w HTML:", htmlToken);
                return htmlToken;
            }
            
            // Sprawdź ciasteczka
            let csrfToken = getCookie("csrftoken");
            if (csrfToken) {
                console.log("Znaleziono token CSRF w ciasteczku:", csrfToken);
                return csrfToken;
            }
            
            // Wykonaj żądanie GET do strony logowania, aby pobrać token CSRF
            console.log("Wykonuję żądanie GET do /login aby pobrać token CSRF");
            const response = await fetch('/login', {
                method: 'GET',
                credentials: 'same-origin'
            });
            
            if (response.ok) {
                console.log("Żądanie GET do /login zakończone sukcesem, sprawdzam ciasteczka");
                
                // Po wykonaniu żądania GET, ciasteczko CSRF powinno być ustawione
                csrfToken = getCookie("csrftoken");
                
                if (csrfToken) {
                    console.log("CSRF Token po żądaniu GET:", csrfToken);
                    return csrfToken;
                } else {
                    // Sprawdź również alternatywne nazwy ciasteczek
                    const alternativeNames = ["XSRF-TOKEN", "CSRF-TOKEN", "_csrf", "csrf", "CSRF"];
                    for (const name of alternativeNames) {
                        const token = getCookie(name);
                        if (token) {
                            console.log(`Znaleziono alternatywny token CSRF w ciasteczku ${name}:`, token);
                            return token;
                        }
                    }
                    
                    console.warn("Nie znaleziono tokenu CSRF w ciasteczkach po żądaniu GET");
                    return null;
                }
            } else {
                console.warn("Nie można pobrać strony logowania:", response.status);
                return null;
            }
        } catch (error) {
            console.error("Błąd podczas pobierania tokenu CSRF:", error);
            return null;
        }
    };
    
    // Funkcje pomocnicze do wyświetlania komunikatów i obsługi ładowania
    const getActiveMessageAreaId = () => {
      const activeForm = document.querySelector('.auth-form.active');
      return activeForm ? activeForm.id.replace('-form', '-message-area') : 'login-message-area';
    };

    const setButtonLoading = (button, isLoading, loadingText = '', originalText = null) => {
      if (!button) return;
      const btn = button; // Uniknięcie problemów z przypisaniem wewnątrz funkcji
      if (!btn.dataset.originalHTML) {
         btn.dataset.originalHTML = btn.innerHTML; // Zapisz oryginalny HTML tylko raz
      }
      const originalHTML = originalText || btn.dataset.originalHTML;

      if (isLoading) {
          btn.disabled = true;
          btn.classList.add('loading');
          // Używamy ::after do spinnera, nie zmieniamy innerHTML, chyba że podano tekst
          if (loadingText && !btn.classList.contains('social-btn')) {
             // Możemy dodać tekst obok spinnera, ale to komplikuje CSS
             // Lepiej polegać na spinnerze w ::after
          }
      } else {
          btn.disabled = false;
          btn.classList.remove('loading');
          btn.innerHTML = originalHTML; // Przywróć oryginalny HTML
      }
    };

    const showMessage = (message, type, areaId = null) => {
        const targetAreaId = areaId || getActiveMessageAreaId();
        const messageElement = document.getElementById(targetAreaId);
        if (!messageElement) { console.warn(`Message area with ID "${targetAreaId}" not found.`); return; }
        // Używamy textContent dla bezpieczeństwa (uniknięcie wstrzykiwania HTML)
        messageElement.textContent = message;
        messageElement.className = `auth-message ${type}`; // Ustaw klasy
        messageElement.style.display = 'block'; // Pokaż

        // Ukryj komunikat o błędzie po pewnym czasie
        if (type === 'error') {
          setTimeout(() => {
            // Sprawdź, czy komunikat nadal istnieje i jest widoczny
            if (messageElement.style.display === 'block' && messageElement.textContent === message) {
                 messageElement.style.display = 'none';
                 messageElement.textContent = '';
            }
          }, 7000); // Ukryj po 7 sekundach
        }
    };

    const showError = (message, areaId = null) => { showMessage(message, 'error', areaId); };
    const showSuccess = (message, areaId = null) => { showMessage(message, 'success', areaId); };

    const clearMessages = (areaId = null) => {
        const targetAreaId = areaId || getActiveMessageAreaId();
        const messageElement = document.getElementById(targetAreaId);
        if (messageElement) {
            messageElement.innerHTML = '';
            messageElement.style.display = 'none';
            messageElement.className = 'auth-message'; // Resetuj klasy
        }
        // Wyczyść też drugi obszar, jeśli areaId nie jest podane
        if (!areaId) {
            const otherAreaId = (targetAreaId === 'login-message-area') ? 'register-message-area' : 'login-message-area';
            const otherMessageElement = document.getElementById(otherAreaId);
            if (otherMessageElement) {
                 otherMessageElement.innerHTML = '';
                 otherMessageElement.style.display = 'none';
                 otherMessageElement.className = 'auth-message';
            }
        }
    };

    // --- Główna funkcja: Utworzenie sesji backendu ---
    const createBackendSession = async (user) => {
        if (!user) {
             console.error("createBackendSession: brak obiektu użytkownika Firebase.");
             showError("Wystąpił wewnętrzny błąd (brak danych użytkownika).", getActiveMessageAreaId());
             return;
        }

        console.log("Attempting to create backend session for UID:", user.uid);
        const activeFormButton = document.querySelector('.auth-form.active button[type="submit"]');
        const originalButtonText = activeFormButton ? activeFormButton.dataset.originalHTML : null;
        if (activeFormButton) setButtonLoading(activeFormButton, true, '', originalButtonText); // Zablokuj przycisk aktywnego formularza
        // Zablokuj też przyciski społecznościowe
        document.querySelectorAll('.social-btn').forEach(btn => setButtonLoading(btn, true));

        // NAPRAWIONO: Zastąpiono niezdefiniowane hideLoginError() przez clearMessages()
        clearMessages(); // Ukryj poprzednie komunikaty

        try {
            // Najpierw pobierz token CSRF
            const csrfToken = await fetchCSRFToken();
            
            // Zawsze pobieraj świeży token przed wysłaniem do backendu
            const idToken = await user.getIdToken(true);
            console.log("Got Firebase ID token, sending to backend...");

            // Przygotuj nagłówki z różnymi wariantami tokenu CSRF
            const headers = { 
                'Content-Type': 'application/json',
            };
            
            // Dodaj token CSRF w różnych formatach nagłówka, jeśli istnieje
            if (csrfToken) {
                // Standardowe i popularne warianty nazwy nagłówka CSRF
                headers['X-CSRF-Token'] = csrfToken;  // Popularne w wielu frameworkach
                headers['X-CSRFToken'] = csrfToken;   // Popularne w Django
                headers['CSRF-Token'] = csrfToken;    // Używane w niektórych implementacjach
                headers['CSRFToken'] = csrfToken;     // Prosty wariant
            } else {
                console.warn("CSRF token not found in cookies or HTML. Request might be rejected.");
            }

            const response = await fetch('/auth/firebase-session-login', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ token: idToken }),
                credentials: 'same-origin' // Ważne: dołącz ciasteczka do żądania
            });

            if (response.ok) {
                console.log("Backend session created successfully via /auth/firebase-session-login.");
                // Zapisz informację, że logowanie się powiodło, aby wyświetlić komunikat po przeładowaniu (opcjonalne)
                sessionStorage.setItem('authActionCompleted', 'true'); // Użyjemy tego w onAuthStateChanged
                // Przekieruj na stronę główną aplikacji
                console.log("Redirecting to /index...");
                window.location.href = '/index'; // Kluczowe przekierowanie
            } else {
                // Błąd po stronie backendu
                const errorData = await response.json().catch(() => ({ detail: `Błąd serwera ${response.status}` }));
                const errorMessage = `Błąd finalizacji logowania (${response.status}): ${errorData.detail || 'Nie można utworzyć sesji backendu.'}`;
                console.error("Backend session creation failed:", errorMessage);
                showError(errorMessage, getActiveMessageAreaId());
                // Wyloguj z Firebase, jeśli backend odrzucił sesję
                if (firebaseAuth) {
                   console.log("Signing out from Firebase due to backend session failure.");
                   await firebaseAuth.signOut();
                }
                 // Odblokuj przyciski po błędzie
                 if (activeFormButton) setButtonLoading(activeFormButton, false, '', originalButtonText);
                 document.querySelectorAll('.social-btn').forEach(btn => setButtonLoading(btn, false));
            }
        } catch (error) {
            console.error("Error during createBackendSession:", error);
            showError(`Wystąpił błąd: ${error.message || 'Sprawdź połączenie internetowe.'}`, getActiveMessageAreaId());
            // Odblokuj przyciski po błędzie
            if (activeFormButton) setButtonLoading(activeFormButton, false, '', originalButtonText);
            document.querySelectorAll('.social-btn').forEach(btn => setButtonLoading(btn, false));
        }
    };

    // --- Inicjalizacja Firebase i nasłuchiwanie stanu ---
    const initializeLoginAuth = async () => {
        console.log("Initializing Firebase on login page...");
        try {
            const response = await fetch('/auth/firebase-config');
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ detail: response.statusText }));
                throw new Error(errorData.detail || `Błąd ${response.status} pobierania konfiguracji Firebase`);
            }
            const config = await response.json();

            if (!config.apiKey || !config.authDomain) {
                throw new Error('Niekompletne dane konfiguracyjne Firebase od backendu.');
            }

            if (firebase.apps.length === 0) {
                firebaseApp = firebase.initializeApp({ apiKey: config.apiKey, authDomain: config.authDomain });
            } else {
                firebaseApp = firebase.app();
            }
            firebaseAuth = firebase.auth();
            console.log("Firebase initialized successfully.");

            // --- Kluczowa Obsługa Stanu Uwierzytelnienia ---
            firebaseAuth.onAuthStateChanged(async (user) => {
                if (user) {
                    // Użytkownik jest zalogowany w Firebase (świeżo lub z pamięci)
                    console.log("Firebase onAuthStateChanged detected user:", user.uid);
                    // Sprawdź, czy już jesteśmy w trakcie tworzenia sesji lub przekierowania
                    if (sessionStorage.getItem('creatingSession') === 'true') {
                         console.log("Session creation already in progress, skipping redundant call.");
                         return;
                    }
                    // Ustaw flagę, że rozpoczynamy proces tworzenia sesji backendu
                    sessionStorage.setItem('creatingSession', 'true');
                    // Wywołaj funkcję tworzenia sesji backendu
                    await createBackendSession(user);
                    // Usuń flagę po zakończeniu (nawet jeśli był błąd i nie było przekierowania)
                    sessionStorage.removeItem('creatingSession');
                } else {
                    // Użytkownik nie jest zalogowany w Firebase
                    console.log("Firebase onAuthStateChanged: No user detected.");
                    // Upewnij się, że przyciski są odblokowane, jeśli nie ma użytkownika
                    const activeFormButton = document.querySelector('.auth-form.active button[type="submit"]');
                    if (activeFormButton && activeFormButton.classList.contains('loading')) {
                         setButtonLoading(activeFormButton, false);
                    }
                    document.querySelectorAll('.social-btn.loading').forEach(btn => setButtonLoading(btn, false));
                    // Wyczyść flagi sesji
                    sessionStorage.removeItem('creatingSession');
                    sessionStorage.removeItem('authActionCompleted');
                }
            });
            // -----------------------------------------------------

            // Po udanej inicjalizacji Firebase, skonfiguruj formularze
            setupAuthForms();

        } catch (error) {
            console.error('Krytyczny błąd inicjalizacji Firebase:', error);
            showError(`Krytyczny błąd: Nie można zainicjować systemu logowania (${error.message}). Odśwież stronę.`, 'login-message-area');
            showError(`Krytyczny błąd: Nie można zainicjować systemu logowania (${error.message}). Odśwież stronę.`, 'register-message-area');
            // Zablokuj wszystkie przyciski
            if (loginButton) loginButton.disabled = true;
            if (registerButton) registerButton.disabled = true;
            document.querySelectorAll('.social-btn').forEach(btn => btn.disabled = true);
        }
    };

    // --- Konfiguracja obsługi formularzy ---
    const setupAuthForms = () => {
        if (loginForm) {
            loginForm.addEventListener('submit', handleLogin);
        } else { console.error("Login form not found"); }

        if (registerForm) {
            registerForm.addEventListener('submit', handleRegister);
        } else { console.error("Register form not found"); }

        if (regPasswordInput) {
            regPasswordInput.addEventListener('input', updatePasswordStrength);
        }

        // Logowanie przez Google
        document.querySelectorAll('.social-btn.google').forEach(button => {
            button.addEventListener('click', () => handleOAuthSignIn('google'));
        });

        // Logowanie przez Microsoft
        document.querySelectorAll('.social-btn.microsoft').forEach(button => {
            button.addEventListener('click', () => handleOAuthSignIn('microsoft'));
        });

        // Logowanie przez LinkedIn (placeholder)
        document.querySelectorAll('.social-btn.linkedin').forEach(button => {
            button.addEventListener('click', () => {
                 showError('Logowanie przez LinkedIn nie jest jeszcze zaimplementowane.', getActiveMessageAreaId());
            });
        });

        // Link "Nie pamiętasz hasła?"
        if (forgotPasswordLink) {
            forgotPasswordLink.addEventListener('click', handleForgotPassword);
        }
    };

    // --- Logika obsługi logowania przez Email/Hasło ---
    const handleLogin = async (event) => {
        event.preventDefault();
        const email = loginEmailInput ? loginEmailInput.value.trim() : null;
        const password = loginPasswordInput ? loginPasswordInput.value : null;
        const messageAreaId = 'login-message-area';
        clearMessages(messageAreaId);

        if (!email || !password) { showError('Wprowadź adres email i hasło.', messageAreaId); return; }
        if (!firebaseAuth) { showError('System logowania nie jest gotowy.', messageAreaId); return; }

        setButtonLoading(loginButton, true);

        try {
            console.log("Attempting Firebase sign in...");
            // Wywołaj logowanie Firebase - resztę załatwi onAuthStateChanged -> createBackendSession
            await firebaseAuth.signInWithEmailAndPassword(email, password);
            console.log("Firebase signInWithEmailAndPassword successful, waiting for onAuthStateChanged...");
            // Nie rób nic więcej, onAuthStateChanged przejmie pałeczkę
        } catch (error) {
            console.error('Firebase Login error:', error);
            let msg = 'Wystąpił błąd podczas logowania.';
            switch (error.code) {
                 case 'auth/invalid-email': msg = 'Nieprawidłowy format adresu email.'; break;
                 case 'auth/user-disabled': msg = 'To konto zostało wyłączone.'; break;
                 case 'auth/user-not-found':
                 case 'auth/wrong-password':
                 case 'auth/invalid-credential': // Nowszy kod błędu dla złych danych
                     msg = 'Nieprawidłowy email lub hasło.'; break;
                 case 'auth/network-request-failed': msg = 'Błąd sieci. Sprawdź połączenie.'; break;
                 default: msg = `Błąd logowania (${error.code || 'nieznany'})`;
            }
            showError(msg, messageAreaId);
            setButtonLoading(loginButton, false); // Odblokuj przycisk po błędzie
        }
        // Nie odblokowujemy przycisku w przypadku sukcesu, bo onAuthStateChanged to zrobi (lub nastąpi przekierowanie)
    };

    // --- Logika obsługi Rejestracji ---
    const handleRegister = async (event) => {
        event.preventDefault();
        const name = regNameInput ? regNameInput.value.trim() : null;
        const email = regEmailInput ? regEmailInput.value.trim() : null;
        const password = regPasswordInput ? regPasswordInput.value : null;
        const confirmPassword = regConfirmPasswordInput ? regConfirmPasswordInput.value : null;
        const termsAccepted = regTermsCheckbox ? regTermsCheckbox.checked : false;
        const messageAreaId = 'register-message-area';
        clearMessages(messageAreaId);

        if (!name || !email || !password || !confirmPassword) { showError('Wypełnij wszystkie pola.', messageAreaId); return; }
        if (password !== confirmPassword) { showError('Wprowadzone hasła nie są zgodne.', messageAreaId); return; }
        if (!isStrongPassword(password)) { showError('Hasło nie spełnia wymagań bezpieczeństwa.', messageAreaId); return; }
        if (!termsAccepted) { showError('Musisz zaakceptować Regulamin i Politykę Prywatności.', messageAreaId); return; }
        if (!firebaseAuth) { showError('System rejestracji nie jest gotowy.', messageAreaId); return; }

        setButtonLoading(registerButton, true);

        try {
            console.log("Attempting Firebase account creation...");
            const userCredential = await firebaseAuth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;
            console.log("Firebase user created:", user.uid);

            // Ustawiamy displayName
            await user.updateProfile({ displayName: name });
            console.log("Firebase profile updated with displayName.");

            // Sukces - resztę załatwi onAuthStateChanged -> createBackendSession
            console.log("Firebase registration successful, waiting for onAuthStateChanged...");

        } catch (error) {
            console.error('Firebase Registration error:', error);
            let msg = 'Wystąpił błąd podczas rejestracji.';
            switch (error.code) {
                 case 'auth/email-already-in-use': msg = 'Ten adres email jest już zarejestrowany.'; break;
                 case 'auth/invalid-email': msg = 'Nieprawidłowy format adresu email.'; break;
                 case 'auth/operation-not-allowed': msg = 'Rejestracja jest obecnie wyłączona.'; break;
                 case 'auth/weak-password': msg = 'Hasło jest zbyt słabe.'; break;
                 default: msg = `Błąd rejestracji (${error.code || 'nieznany'})`;
            }
            showError(msg, messageAreaId);
            setButtonLoading(registerButton, false); // Odblokuj po błędzie
        }
        // Nie odblokowujemy przycisku w przypadku sukcesu
    };

   // --- Logika obsługi Logowania przez OAuth (Google, Microsoft) ---
    const handleOAuthSignIn = async (providerName) => {
        let provider;
        const buttonSelector = `.auth-form.active .social-btn.${providerName}`;
        const button = document.querySelector(buttonSelector);

        if (!button) { console.error(`Button ${buttonSelector} not found.`); return; }
        if (!firebaseAuth) { showError('System logowania nie jest gotowy.', getActiveMessageAreaId()); return; }

        switch(providerName) {
            case 'google':
                provider = new firebase.auth.GoogleAuthProvider();
                // Można dodać scope, np. provider.addScope('profile'); provider.addScope('email');
                break;
            case 'microsoft':
                provider = new firebase.auth.OAuthProvider('microsoft.com');
                // provider.setCustomParameters({ tenant: 'YOUR_TENANT_ID' }); // Jeśli potrzebne
                // provider.addScope('User.Read'); // Przykładowy scope Microsoft Graph
                break;
            default:
                showError(`Dostawca logowania "${providerName}" nie jest obsługiwany.`, getActiveMessageAreaId());
                return;
        }

        clearMessages();
        setButtonLoading(button, true);

        try {
            console.log(`Attempting sign in with ${providerName}...`);
            // Wywołaj logowanie przez popup Firebase - resztę załatwi onAuthStateChanged -> createBackendSession
            await firebaseAuth.signInWithPopup(provider);
            console.log(`Firebase ${providerName} sign in successful, waiting for onAuthStateChanged...`);
            // Nie rób nic więcej, onAuthStateChanged przejmie pałeczkę
        } catch (error) {
            console.error(`${providerName} Sign-In Error:`, error);
            let msg = `Wystąpił błąd podczas logowania przez ${providerName}.`;
            switch(error.code) {
                 case 'auth/account-exists-with-different-credential': msg = 'Konto z tym adresem email już istnieje i jest powiązane z innym sposobem logowania.'; break;
                 case 'auth/popup-closed-by-user': msg = `Logowanie przez ${providerName} zostało anulowane.`; break;
                 case 'auth/popup-blocked': msg = `Wyskakujące okienko logowania ${providerName} zostało zablokowane. Odblokuj je i spróbuj ponownie.`; break;
                 case 'auth/cancelled-popup-request': msg = 'Anulowano kolejne żądanie otwarcia wyskakującego okienka.'; break;
                 case 'auth/operation-not-allowed': msg = `Logowanie przez ${providerName} nie jest włączone w Firebase.`; break;
                 case 'auth/unauthorized-domain': msg = `Ta domena nie jest autoryzowana do operacji Firebase.`; break;
                 default: msg = `Błąd logowania przez ${providerName} (${error.code || 'nieznany'})`;
            }
            showError(msg, getActiveMessageAreaId());
            setButtonLoading(button, false); // Odblokuj po błędzie
        }
         // Nie odblokowujemy przycisku w przypadku sukcesu
    };


    // --- Logika obsługi "Nie pamiętasz hasła?" ---
    const handleForgotPassword = (event) => {
        event.preventDefault();
        const email = loginEmailInput ? loginEmailInput.value.trim() : null; // Pobierz email z formularza logowania
        const messageAreaId = 'login-message-area'; // Komunikat w sekcji logowania
        clearMessages(messageAreaId);

        if (!email) { showError('Wpisz swój adres email w polu powyżej, aby zresetować hasło.', messageAreaId); return; }
        if (!firebaseAuth) { showError('System resetowania hasła nie jest gotowy.', messageAreaId); return; }

        console.log(`Sending password reset email to ${email}...`);
        // Wyświetl tymczasowy komunikat o ładowaniu
        showSuccess('Wysyłanie instrukcji resetowania hasła...', messageAreaId);

        firebaseAuth.sendPasswordResetEmail(email)
          .then(() => {
            console.log("Password reset email sent successfully.");
            showSuccess('Link do zresetowania hasła został wysłany na Twój adres email. Sprawdź skrzynkę odbiorczą (również folder spam).', messageAreaId);
          })
          .catch((error) => {
            console.error('Password Reset error:', error);
            let msg = 'Nie udało się wysłać linku do resetowania hasła.';
            if (error.code === 'auth/invalid-email') { msg += ' Sprawdź poprawność adresu email.'; }
            else if (error.code === 'auth/user-not-found') { msg = 'Nie znaleziono konta powiązanego z tym adresem email.'; }
            else { msg += ` (Błąd: ${error.code || 'nieznany'})`; }
            showError(msg, messageAreaId);
          });
    };


    // --- Logika sprawdzania siły hasła ---
    const isStrongPassword = (password) => {
        // Min. 8 znaków, wielka litera, mała litera, cyfra, znak specjalny
        const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#()_+=\-[\]{}|\\:;"'<>,.?/~`])[A-Za-z\d@$!%*?&^#()_+=\-[\]{}|\\:;"'<>,.?/~`]{8,}$/;
        return strongPasswordRegex.test(password);
    };

    const updatePasswordStrength = (event) => {
        const password = event.target.value;
        if (!strengthBar) return;

        if (!password) {
            strengthBar.style.width = '0%';
            strengthBar.style.backgroundColor = '#ddd'; // Kolor domyślny paska
            return;
        }
        let strength = 0;
        if (password.length >= 8) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[a-z]/.test(password)) strength++;
        if (/\d/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++; // Sprawdza obecność znaku specjalnego

        // Prosty system punktowy (max 5 punktów) -> procenty
        const percentage = Math.min((strength / 5) * 100, 100);
        strengthBar.style.width = `${percentage}%`;

        // Kolorowanie paska
        if (strength <= 1) strengthBar.style.backgroundColor = '#FF4B4B';      // Bardzo słabe
        else if (strength <= 2) strengthBar.style.backgroundColor = '#FFA500'; // Słabe
        else if (strength <= 3) strengthBar.style.backgroundColor = '#FFD700'; // Średnie
        else if (strength <= 4) strengthBar.style.backgroundColor = '#90EE90'; // Dobre (poprawiono)
        else strengthBar.style.backgroundColor = '#4CAF50'; // Bardzo dobre (poprawiono)
    };


    // --- Logika przełączania zakładek ---
    const tabButtons = document.querySelectorAll('.tab-btn');
    const authForms = document.querySelectorAll('.auth-form');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        // Odznacz wszystkie przyciski i ukryj formularze
        tabButtons.forEach(btn => btn.classList.remove('active'));
        authForms.forEach(form => form.classList.remove('active'));
        // Wyczyść komunikaty przy zmianie zakładki
        clearMessages();
        // Zaznacz kliknięty przycisk i pokaż odpowiedni formularz
        button.classList.add('active');
        const targetFormId = button.dataset.target;
        const targetForm = document.getElementById(targetFormId);
        if (targetForm) {
             targetForm.classList.add('active');
        } else {
             console.error(`Target form with ID "${targetFormId}" not found.`);
        }
      });
    });

    // --- Inicjalizacja Firebase na końcu ---
    initializeLoginAuth();

  }); // Koniec DOMContentLoaded
</script>

</body>
</html>
