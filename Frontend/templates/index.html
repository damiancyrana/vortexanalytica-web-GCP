<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Analytica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <canvas id="quantum-field"></canvas>

        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>

        <div class="logo">
          <div class="logo-text">Vortex Analytica</div>
        </div>
      </div>

      <div class="header-right-group">
        <div class="user-info">
          <span class="user-welcome">Hello, 
            <span id="user-display-name"></span>
          </span>
        </div>
        <button class="header-btn" id="feedback-btn">Feedback</button>

      </div>
    </div>
  </header>

  <div class="sidebar" id="sidebar">
    <ul class="sidebar-menu">
      <li>
        <a href="#" class="active" data-view="feed">
          <i class="fas fa-rss"></i> Feed
        </a>
      </li>
    </ul>

    <div class="sidebar-theme-toggle">
      <i class="fas fa-sun"></i>
      <span>Change theme</span>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle-checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main-content" id="contentWrapper">
    <main>
      <div class="view-section active" id="feed-view">
          <!-- News Container on the left side -->
          <div class="news-container"></div>

          <div class="dashboard-container">

          </div>

      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script type="module" src="/static/js/quantum_bg_no_particles.js"></script>
  <script src="/static/js/index.js"></script>
  <script src="/static/js/side_menu.js"></script>
  <script src="/static/js/news_updater.js"></script>
  <script src="/static/js/graph.js"></script>
</body>
</html>
