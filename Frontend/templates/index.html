<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Analytica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/index.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* Dostosowania dla nowego układu strony */
    :root {
      --header-height: 50px; /* Zmniejszony o 25% z 60px */
      --sidebar-width: 250px;
      
      /* Kolory jasnego motywu (premium fintech) */
      --light-bg: #f3f4f8; /* Jasny niebieskoszary - profesjonalny wygląd */
      --light-text: #2a2d3e; /* Ciemny niebieski - elegancki kontrast */
      --light-text-muted: #6b7280; /* Stonowany szary */
      --light-accent: #00c6ff; /* Jaśniejszy niebieski akcent dla jasnego motywu */
      --light-border: #d1d5db; /* Jasnoszara granica */
      --light-sidebar-bg: #e9eef2; /* Jasny niebieskoszary dla sidebar */
      --light-sidebar-hover: rgba(0, 198, 255, 0.1); /* Akcent hover */
      --light-sidebar-active: rgba(0, 198, 255, 0.15); /* Akcent aktywny */
      --light-header-bg: #0f172a; /* Ciemny granatowy header - premium look */
      --light-header-text: #ffffff;
      --light-btn-bg: #334155; /* Ciemniejszy odcień dla przycisków */
      --light-btn-text: #ffffff;
      --light-btn-border: #4b5563; /* Ciemniejsze obramowanie */
      
      /* Kolory ciemnego motywu */
      --dark-bg: #0a0a10;
      --dark-text: #e2e8f0;
      --dark-text-muted: #aaaaaa;
      --dark-accent: #00e5ff;
      --dark-border: rgba(0, 229, 255, 0.15);
      --dark-sidebar-bg: rgba(10, 10, 16, 0.9);
      --dark-sidebar-hover: rgba(0, 229, 255, 0.1);
      --dark-sidebar-active: rgba(0, 229, 255, 0.15);
      --dark-header-bg: #0a0a10;
      --dark-header-text: #ffffff;
      --dark-btn-bg: transparent;
      --dark-btn-text: #ffffff;
      --dark-btn-border: rgba(255, 255, 255, 0.2);
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--dark-bg);
      color: var(--dark-text);
    }

    body:not(.dark-theme) {
      background-color: var(--light-bg);
      color: var(--light-text);
    }

    .header-container {
      width: 100%;
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.5rem;
      height: var(--header-height);
    }

    /* Menu boczne */
    .sidebar {
      position: fixed;
      left: 0;
      top: var(--header-height);
      width: var(--sidebar-width);
      height: calc(100vh - var(--header-height));
      background-color: var(--dark-sidebar-bg);
      border-right: 1px solid var(--dark-border);
      z-index: 999;
      padding-top: 10px;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    body:not(.dark-theme) .sidebar {
      background-color: var(--light-sidebar-bg);
      border-right: 1px solid var(--light-border);
      color: var(--light-text);
    }

    .sidebar.active {
      transform: translateX(0);
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li {
      margin-bottom: 5px;
    }

    .sidebar-menu a {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      color: var(--dark-text);
      text-decoration: none;
      transition: background-color 0.2s;
    }

    body:not(.dark-theme) .sidebar-menu a {
      color: var(--light-text);
    }

    .sidebar-menu a:hover {
      background-color: var(--dark-sidebar-hover);
      color: var(--dark-accent);
    }

    body:not(.dark-theme) .sidebar-menu a:hover {
      background-color: var(--light-sidebar-hover);
      color: var(--light-accent);
    }

    .sidebar-menu a.active {
      background-color: var(--dark-sidebar-active);
      color: var(--dark-accent);
      border-left: 3px solid var(--dark-accent);
    }

    body:not(.dark-theme) .sidebar-menu a.active {
      background-color: var(--light-sidebar-active);
      color: var(--light-accent);
      border-left: 3px solid var(--light-accent);
    }

    .sidebar-menu i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    /* Przycisk hamburger */
    .menu-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--dark-accent);
      cursor: pointer;
      padding: 0.5rem;
      margin-right: 1rem;
      display: flex;
      align-items: center;
    }

    body:not(.dark-theme) .menu-toggle {
      color: var(--light-accent);
    }

    /* Przyciski w headerze */
    .header-btn {
      padding: 6px 14px;
      background-color: var(--dark-btn-bg);
      color: var(--dark-btn-text);
      border: 1px solid var(--dark-btn-border);
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-left: 10px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Exo 2', sans-serif;
      min-width: 100px;
    }

    body:not(.dark-theme) .header-btn {
      background-color: var(--light-btn-bg);
      color: var(--light-btn-text);
      border: 1px solid var(--light-btn-border);
    }

    .header-btn:hover {
      color: var(--dark-accent);
      border-color: var(--dark-accent);
      background-color: rgba(0, 229, 255, 0.05);
    }

    body:not(.dark-theme) .header-btn:hover {
      color: var(--light-btn-text);
      border-color: var(--light-accent);
      background-color: rgba(0, 198, 255, 0.2);
    }

    /* Logo i sekcja nagłówka */
    .logo-section {
      display: flex;
      align-items: center;
    }

    .logo-text {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Exo 2', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      line-height: 1;
      text-shadow: none;
      white-space: nowrap;
    }

    /* Sekcja prawa nagłówka */
    .header-right-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .user-info {
      color: var(--dark-header-text);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    body:not(.dark-theme) .user-info {
      color: var(--light-header-text);
    }

    #user-display-name {
      font-weight: 600;
      color: var(--dark-accent);
    }

    body:not(.dark-theme) #user-display-name {
      color: var(--light-accent);
    }

    /* Pusty kontener treści */
    .empty-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: var(--dark-text-muted);
      font-size: 1.2rem;
    }

    body:not(.dark-theme) .empty-content {
      color: var(--light-text-muted);
    }

    /* Główna zawartość */
    .main-content {
      flex-grow: 1;
      margin-top: var(--header-height);
      height: calc(100vh - var(--header-height));
      overflow: auto;
      padding: 0;
      max-width: 100%;
      width: 100%;
    }

    /* Boczny przełącznik motywu */
    .sidebar-theme-toggle {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      margin-top: 20px;
      border-top: 1px solid var(--dark-border);
      color: var(--dark-text);
    }

    body:not(.dark-theme) .sidebar-theme-toggle {
      border-top: 1px solid var(--light-border);
      color: var(--light-text);
    }

    .sidebar-theme-toggle span {
      margin-left: 10px;
    }

    /* NAPRAWIONY PRZEŁĄCZNIK MOTYWU */
    .theme-switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 22px;
      margin-left: auto;
    }

    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 22px;
      overflow: hidden; /* Dodane aby kontrolować zawartość */
    }

    body:not(.dark-theme) .slider {
      background-color: #aaa;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
      z-index: 2;
    }

    input:checked + .slider {
      background-color: var(--dark-accent);
    }

    body:not(.dark-theme) input:checked + .slider {
      background-color: var(--light-accent);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Usuwamy footer */
    footer {
      display: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background-color: var(--dark-header-bg);
      border-bottom: 1px solid var(--dark-border);
      z-index: 1000;
    }

    body:not(.dark-theme) header {
      background-color: var(--light-header-bg);
      border-bottom: 1px solid var(--light-border);
    }

    /* Dodatkowe style dla widoków */
    .view-section {
      height: 100%;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    /* POPRAWIONE STYLOWANIE PRZYCISKU LOGOUT */
    .logoutButton {
      --figure-duration: 100;
      --transform-figure: none;
      --walking-duration: 100;
      --transform-arm1: none;
      --transform-wrist1: none;
      --transform-arm2: none;
      --transform-wrist2: none;
      --transform-leg1: none;
      --transform-calf1: none;
      --transform-leg2: none;
      --transform-calf2: none;
      
      background: transparent;
      border: 1px solid var(--dark-btn-border);
      outline: 0;
      padding: 0 35px 0 14px; /* Zwiększony prawy padding dla animacji */
      text-align: left;
      width: 130px; /* Stała szerokość */
      height: 32px; /* Dostosowana wysokość do innych przycisków */
      flex-shrink: 0;
      color: var(--dark-btn-text);
      cursor: pointer;
      display: block;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 4px;
      position: relative;
      margin-left: 10px;
    }

    body:not(.dark-theme) .logoutButton {
      background-color: var(--light-btn-bg);
      color: var(--light-btn-text);
      border: 1px solid var(--light-btn-border);
    }

    .logoutButton:hover {
      border-color: var(--dark-accent);
      background-color: rgba(0, 229, 255, 0.05);
    }

    body:not(.dark-theme) .logoutButton:hover {
      border-color: var(--light-accent);
      background-color: rgba(0, 198, 255, 0.2);
    }

    /* Zachowanie oryginalnej animacji */
    .logoutButton::before {
      content: '';
      background-color: var(--dark-btn-bg);
      border-radius: 4px;
      display: block;
      height: 100%;
      left: 0;
      position: absolute;
      top: 0;
      transform: none;
      transition: transform .05s ease, opacity var(--t-fast);
      width: 100%;
      z-index: 2;
    }

    body:not(.dark-theme) .logoutButton::before {
      background-color: var(--light-btn-bg);
    }

    .logoutButton .button-text {
      color: var(--dark-btn-text);
      font-weight: 500;
      position: relative;
      z-index: 10;
      line-height: 25px;
      transition: opacity var(--t-fast);
      font-size: 0.8rem;
    }

    body:not(.dark-theme) .logoutButton .button-text {
      color: var(--light-btn-text);
    }

    /* Dostosowane rozmiary i pozycje elementów SVG */
    .logoutButton svg {
      display: block;
      position: absolute;
      transition: opacity var(--t-fast);
      z-index: 5;
    }

    .logoutButton .figure {
      bottom: 5px;
      fill: var(--dark-accent);
      right: 18px;
      transform: var(--transform-figure);
      transition: transform calc(var(--figure-duration)*1ms) cubic-bezier(.2,.1,.8,.9);
      width: 25px; /* Zmniejszone z 30px */
      z-index: 4;
    }

    body:not(.dark-theme) .logoutButton .figure {
      fill: var(--light-accent);
    }

    .logoutButton .door, 
    .logoutButton .doorway {
      bottom: 4px;
      fill: var(--dark-btn-text);
      right: 12px;
      width: 24px; /* Zmniejszone z 32px */
    }

    body:not(.dark-theme) .logoutButton .door path, 
    body:not(.dark-theme) .logoutButton .doorway path {
      fill: var(--light-btn-text);
    }

    .logoutButton .door {
      transform: rotateY(0deg);
      transform-origin: 100% 50%;
      transform-style: preserve-3d;
      transition: transform .2s ease;
      z-index: 5;
    }

    .logoutButton .door path {
      fill: var(--dark-accent);
      stroke: var(--dark-accent);
      stroke-width: 4;
    }

    body:not(.dark-theme) .logoutButton .door path {
      fill: var(--light-accent);
      stroke: var(--light-accent);
    }

    .logoutButton .doorway {
      z-index: 3;
    }

    .logoutButton .bang {
      opacity: 0;
    }

    .logoutButton .arm1, 
    .logoutButton .arm2, 
    .logoutButton .calf1, 
    .logoutButton .calf2, 
    .logoutButton .leg1, 
    .logoutButton .leg2, 
    .logoutButton .wrist1, 
    .logoutButton .wrist2 {
      transition: transform calc(var(--walking-duration)*1ms) ease-in-out;
    }

    .logoutButton .arm1 {
      transform: var(--transform-arm1);
      transform-origin: 52% 45%;
    }

    .logoutButton .wrist1 {
      transform: var(--transform-wrist1);
      transform-origin: 59% 55%;
    }

    .logoutButton .arm2 {
      transform: var(--transform-arm2);
      transform-origin: 47% 43%;
    }

    .logoutButton .wrist2 {
      transform: var(--transform-wrist2);
      transform-origin: 35% 47%;
    }

    .logoutButton .leg1 {
      transform: var(--transform-leg1);
      transform-origin: 47% 64.5%;
    }

    .logoutButton .calf1 {
      transform: var(--transform-calf1);
      transform-origin: 55.5% 71.5%;
    }

    .logoutButton .leg2 {
      transform: var(--transform-leg2);
      transform-origin: 43% 63%;
    }

    .logoutButton .calf2 {
      transform: var(--transform-calf2);
      transform-origin: 41.5% 73%;
    }

    .logoutButton:active::before {
      transform: scale(.96);
    }

    .logoutButton.clicked .door {
      transform: rotateY(35deg);
    }

    .logoutButton.door-slammed .door {
      transform: none;
      transition: transform .1s ease-in .25s;
    }

    .logoutButton.falling {
      animation: shake .2s linear;
    }

    .logoutButton.falling .bang {
      animation: flash .3s linear;
    }

    .logoutButton.falling .figure {
      animation: spin 1s infinite linear;
      bottom: -100px;
      opacity: 0;
      right: 1px;
      transition: transform calc(var(--figure-duration)*1ms) linear, bottom calc(var(--figure-duration)*1ms) cubic-bezier(.7,.1,1,1) .1s, opacity calc(var(--figure-duration)*.25ms) linear calc(var(--figure-duration)*.75ms);
      z-index: 1;
    }

    body:not(.dark-theme) .logoutButton::before {
      background-color: var(--light-btn-bg);
    }

    @keyframes spin{0%{transform:rotate(0deg) scale(.94)}to{transform:rotate(359deg) scale(.94)}}
    @keyframes shake{0%,to{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
    @keyframes flash{0%{opacity:.4}to{opacity:0}}
  </style>
</head>

  <script>
    // Obsługa menu bocznego
    document.addEventListener('DOMContentLoaded', function() {
      const menuToggle = document.getElementById('menu-toggle');
      const sidebar = document.getElementById('sidebar');
      const themeToggleCheckbox = document.getElementById('theme-toggle-checkbox');
      const feedbackBtn = document.getElementById('feedback-btn');
      
      // Ustaw początkowy stan motywu
      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.remove('dark-theme');
        if (themeToggleCheckbox) themeToggleCheckbox.checked = false;
        const themeIcon = document.querySelector('.sidebar-theme-toggle i');
        if (themeIcon) themeIcon.className = 'fas fa-moon';
      }
      
      // Obsługa przycisku hamburger
      menuToggle.addEventListener('click', function() {
        sidebar.classList.toggle('active');
      });
      
      // Zamknij menu po kliknięciu poza nim
      document.addEventListener('click', function(event) {
        if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
          sidebar.classList.remove('active');
        }
      });
      
      // Obsługa przełączania motywu z menu bocznego
      if (themeToggleCheckbox) {
        themeToggleCheckbox.addEventListener('change', function() {
          document.body.classList.toggle('dark-theme');
          const isDark = document.body.classList.contains('dark-theme');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          
          // Zmień ikonę w menu bocznym
          const themeIcon = document.querySelector('.sidebar-theme-toggle i');
          if (themeIcon) {
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
          }
          
          // Wywołaj funkcję aktualizacji kolorów w tle Three.js
          if (typeof window.updateThemeColors === 'function') {
            window.updateThemeColors();
          }
        });
      }
      
      // Obsługa przycisku Feedback (tylko placeholder zgodnie z wymaganiami)
      if (feedbackBtn) {
        feedbackBtn.addEventListener('click', function() {
          alert('Funkcja "Feedback" zostanie zaimplementowana w przyszłości.');
        });
      }
      
      // Modyfikacja tła w trybie jasnym dla spiralnego efektu
      function updateBackgroundEffect() {
        if (typeof window.updateThemeColors === 'function') {
          // Gdy funkcja jest dostępna, wywołujemy ją przy każdej zmianie motywu
          window.updateThemeColors();
        } else {
          // Polling do sprawdzenia, czy funkcja updateThemeColors stała się dostępna
          const checkInterval = setInterval(() => {
            if (typeof window.updateThemeColors === 'function') {
              window.updateThemeColors();
              clearInterval(checkInterval);
            }
          }, 200);
          
          // Zatrzymaj polling po 5 sekundach, jeśli funkcja nie zostanie znaleziona
          setTimeout(() => clearInterval(checkInterval), 5000);
        }
      }
      
      // Uruchom aktualizację tła przy inicjalizacji
      updateBackgroundEffect();
    });
  </script>
</body>
</html>
