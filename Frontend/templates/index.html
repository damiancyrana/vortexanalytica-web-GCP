  <style>
    /* Network graph styles */
    .network-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid var(--current-border-color);
      background-color: var(--current-item-bg);
    }
    
    .network-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 10px;
    }
    
    .links line {
      stroke: rgba(0, 229, 255, 0.3);
      transition: stroke 0.3s, stroke-width 0.3s, stroke-opacity 0.3s;
    }
    
    .nodes circle {
      transition: fill 0.3s, stroke 0.3s, stroke-width 0.3s, opacity 0.3s;
      cursor: pointer;
    }
    
    .labels text {
      font-family: 'Exo 2', sans-serif;
      transition: opacity 0.3s;
      paint-order: stroke;
    }
    
    /* Side-by-side layout styles */
    .feed-content {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 15px;
    }
    
    .news-container {
      width: 48%;
      flex: 0 0 48%;
    }
    
    .graph-container {
      width: 48%;
      flex: 0 0 48%;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    @media (max-width: 992px) {
      .feed-content {
        flex-direction: column;
      }
      
      .news-container, .graph-container {
        width: 100%;
        flex: 0 0 100%;
      }
      
      .graph-container {
        margin-top: 15px;
        height: auto;
      }
    }
  </style>

  <script>
    // Network Graph code
    let storedMessages = [];
    let networkGraph = null;
    let labelsVisible = true;
    
    // Debug logging for network graph generation
    console.log("Network graph script loading...");
    
    // Function to process news data and create graph data structure
    function processNewsData(newsData) {
      console.log("Processing news data for graph:", newsData.length, "messages");
      
      const nodesMap = new Map();
      const linksMap = new Map();
      
      // Process each news item
      newsData.forEach(news => {
        // Access interpretation_tags correctly from the nested structure
        let tags = [];
        try {
          if (news && news.analysis_payload && 
              news.analysis_payload.knowledge_graph_data && 
              news.analysis_payload.knowledge_graph_data.interpretation_tags && 
              Array.isArray(news.analysis_payload.knowledge_graph_data.interpretation_tags)) {
            tags = news.analysis_payload.knowledge_graph_data.interpretation_tags;
            console.log("Found tags for message", news.news_id, ":", tags);
          }
        } catch (e) {
          console.warn("Could not extract interpretation_tags from news item", news.news_id, e);
        }
        
        // Skip if no tags or only one tag
        if (tags.length <= 1) {
          console.log("Skipping message with insufficient tags:", news.news_id);
          return;
        }
        
        // Process each tag
        tags.forEach(tag => {
          // Add node if it doesn't exist
          if (!nodesMap.has(tag)) {
            nodesMap.set(tag, {
              id: tag,
              count: 1,
              connections: new Set()
            });
          } else {
            // Increment count if node exists
            const node = nodesMap.get(tag);
            node.count += 1;
            nodesMap.set(tag, node);
          }
          
          // Process connections between tags
          tags.forEach(otherTag => {
            if (tag !== otherTag) {
              // Add connection to the node's connections set
              const node = nodesMap.get(tag);
              node.connections.add(otherTag);
              nodesMap.set(tag, node);
              
              // Create link
              const linkId = [tag, otherTag].sort().join('-');
              
              if (!linksMap.has(linkId)) {
                linksMap.set(linkId, {
                  id: linkId,
                  source: tag,
                  target: otherTag,
                  value: 1
                });
              } else {
                const link = linksMap.get(linkId);
                link.value += 1;
                linksMap.set(linkId, link);
              }
            }
          });
        });
      });
      
      // Convert nodesMap to array of nodes
      const nodes = Array.from(nodesMap.entries()).map(([id, node]) => ({
        id,
        count: node.count,
        degree: node.connections.size
      }));
      
      // Convert linksMap to array of links
      const links = Array.from(linksMap.values());
      
      console.log("Graph data generated:", nodes.length, "nodes,", links.length, "links");
      return { nodes, links };
    }
    
    // Function to create network graph
    function createNetworkGraph(graphData) {
      console.log("Creating network graph with data:", graphData);
      
      // Clear any existing visualization
      d3.select('#networkGraphContainer').html('');
      
      if (!graphData || !graphData.nodes || graphData.nodes.length === 0) {
        console.log("No graph data available, showing empty state");
        d3.select('#networkGraphContainer').html(`
          <div style="display: flex; justify-content: center; align-items: center; height: 100%;">
            <p>No topic data available. Waiting for messages with interpretation tags...</p>
          </div>
        `);
        return;
      }
      
      const container = document.getElementById('networkGraphContainer');
      if (!container) {
        console.error("Network graph container not found!");
        return;
      }
      
      // Force a minimum height on the container to ensure proper rendering
      if (container.clientHeight < 300) {
        container.style.height = '300px';
      }
      
      const width = container.clientWidth;
      const height = container.clientHeight;
      
      console.log("Graph dimensions:", width, "x", height);
      
      // Create SVG element
      const svg = d3.select('#networkGraphContainer')
        .append('svg')
        .attr('width', width)
        .attr('height', height)
        .attr('viewBox', [0, 0, width, height]);
        
      // Create container for the graph
      const graphContainer = svg.append('g');
      
      // Create zoom behavior
      const zoom = d3.zoom()
        .scaleExtent([0.1, 4])
        .on('zoom', (event) => {
          graphContainer.attr('transform', event.transform);
        });
        
      svg.call(zoom);
      
      // Create simulation
      const simulation = d3.forceSimulation(graphData.nodes)
        .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide().radius(d => Math.sqrt(d.count) * 5 + 15).iterations(2));
        
      // Create links
      const link = graphContainer.append('g')
        .attr('class', 'links')
        .selectAll('line')
        .data(graphData.links)
        .enter()
        .append('line')
        .attr('stroke-width', d => Math.sqrt(d.value) + 1)
        .attr('stroke-opacity', 0.6);
        
      // Create nodes
      const node = graphContainer.append('g')
        .attr('class', 'nodes')
        .selectAll('circle')
        .data(graphData.nodes)
        .enter()
        .append('circle')
        .attr('r', d => Math.sqrt(d.count) * 4 + 8)
        .attr('fill', d => d3.interpolateSpectral(d.id.length % 20 / 20))
        .attr('stroke', '#fff')
        .attr('stroke-width', 1.5)
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));
          
      // Create labels
      const label = graphContainer.append('g')
        .attr('class', 'labels')
        .selectAll('text')
        .data(graphData.nodes)
        .enter()
        .append('text')
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('dy', d => -Math.sqrt(d.count) * 4 - 12)
        .text(d => d.id)
        .attr('font-size', '12px')
        .attr('fill', '#fff')
        .attr('stroke', '#000')
        .attr('stroke-width', 0.5)
        .attr('pointer-events', 'none')
        .attr('opacity', labelsVisible ? 1 : 0);
        
      // Add title for tooltip
      node.append('title')
        .text(d => `${d.id}\nOccurrences: ${d.count}\nConnections: ${d.degree}`);
        
      // Add interactivity
      node.on('mouseover', nodeMouseover)
        .on('mouseout', nodeMouseout)
        .on('click', nodeClick);
        
      link.on('mouseover', linkMouseover)
        .on('mouseout', linkMouseout);
        
      // Update positions on tick
      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
          
        node
          .attr('cx', d => d.x)
          .attr('cy', d => d.y);
          
        label
          .attr('x', d => d.x)
          .attr('y', d => d.y);
      });
      
      // Store the simulation reference
      networkGraph = {
        simulation,
        container: graphContainer,
        svg,
        node,
        link,
        label,
        data: graphData
      };
      
      console.log("Network graph created successfully");
      
      // Drag functions
      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }
      
      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }
      
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }
      
      // Hover functions
      function nodeMouseover(event, d) {
        // Highlight the node
        d3.select(this)
          .attr('stroke', '#ff0')
          .attr('stroke-width', 3);
          
        // Highlight connected links and nodes
        link.attr('stroke-opacity', l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.1);
        node.attr('opacity', n => n.id === d.id || 
          graphData.links.some(l => 
            (l.source.id === d.id && l.target.id === n.id) || 
            (l.target.id === d.id && l.source.id === n.id)
          ) ? 1 : 0.3);
        label.attr('opacity', n => {
          if (!labelsVisible) return 0;
          return n.id === d.id || 
            graphData.links.some(l => 
              (l.source.id === d.id && l.target.id === n.id) || 
              (l.target.id === d.id && l.source.id === n.id)
            ) ? 1 : 0.3;
        });
      }
      
      function nodeMouseout(event, d) {
        // Reset all elements
        d3.select(this)
          .attr('stroke', '#fff')
          .attr('stroke-width', 1.5);
          
        link.attr('stroke-opacity', 0.6);
        node.attr('opacity', 1);
        label.attr('opacity', labelsVisible ? 1 : 0);
      }
      
      function linkMouseover(event, d) {
        // Highlight the link
        d3.select(this)
          .attr('stroke', '#ff0')
          .attr('stroke-width', Math.sqrt(d.value) + 2);
          
        // Highlight connected nodes
        node.attr('opacity', n => n.id === d.source.id || n.id === d.target.id ? 1 : 0.3);
        label.attr('opacity', n => {
          if (!labelsVisible) return 0;
          return n.id === d.source.id || n.id === d.target.id ? 1 : 0.3;
        });
      }
      
      function linkMouseout(event, d) {
        // Reset all elements
        d3.select(this)
          .attr('stroke', 'rgba(0, 229, 255, 0.3)')
          .attr('stroke-width', Math.sqrt(d.value) + 1);
          
        node.attr('opacity', 1);
        label.attr('opacity', labelsVisible ? 1 : 0);
      }
      
      // Click function
      function nodeClick(event, d) {
        // Find connected nodes
        const connectedNodes = graphData.links
          .filter(l => l.source.id === d.id || l.target.id === d.id)
          .map(l => {
            const connectedId = l.source.id === d.id ? l.target.id : l.source.id;
            const connectedNode = graphData.nodes.find(n => n.id === connectedId);
            return {
              id: connectedId,
              count: connectedNode ? connectedNode.count : 0,
              strength: l.value
            };
          });
          
        const sortedConnections = connectedNodes.sort((a, b) => b.strength - a.strength);
        
        // Display details in the details container
        displayNodeDetails(d, sortedConnections);
      }
    }
    
    // Function to display node details
    function displayNodeDetails(node, connections) {
      const detailsContainer = document.getElementById('detailsContainer');
      if (!detailsContainer) return;
      
      detailsContainer.innerHTML = `
        <h3 class="network-title">${node.id}</h3>
        <p>Occurrences: ${node.count} | Connected to ${connections.length} other topics</p>
        <div style="margin-top: 10px;">
          <p><strong>Connected Topics:</strong></p>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px;">
            ${connections.map(conn => 
              `<div style="
                background-color: rgba(0, 229, 255, 0.1); 
                padding: 5px 10px; 
                border-radius: 4px; 
                border: 1px solid rgba(0, 229, 255, 0.2);
                font-size: 0.9rem;
              ">
                ${conn.id} 
                <span style="opacity: 0.7; font-size: 0.8rem;">
                  (${conn.count} occurrences, strength: ${conn.strength})
                </span>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
    }
    
    // Function to update the network graph
    function updateNetworkGraph(messages) {
      console.log("Updating network graph with", messages.length, "messages");
      
      // Store messages
      storedMessages = messages;
      
      // Process data
      const graphData = processNewsData(messages);
      
      // Create or update the graph
      createNetworkGraph(graphData);
      
      // Update details if empty
      const detailsContainer = document.getElementById('detailsContainer');
      if (detailsContainer && !detailsContainer.innerHTML) {
        detailsContainer.innerHTML = `
          <h3 class="network-title">Topic Network Graph</h3>
          <p>This visualization shows relationships between market topics based on how frequently they co-occur in news items.</p>
          <p>Larger nodes indicate topics mentioned more frequently. Thicker lines indicate stronger relationships between topics.</p>
          <p><strong>Interaction:</strong></p>
          <ul>
            <li>Click on a topic node to see detailed connections</li>
            <li>Drag nodes to reposition them</li>
            <li>Scroll to zoom in/out</li>
            <li>Click the reset button to restore the original layout</li>
          </ul>
        `;
      }
    }
    
    // Function to manually process received messages
    function processReceivedMessages() {
      console.log("Manually processing received messages:", storedMessages.length);
      if (storedMessages.length > 0) {
        updateNetworkGraph(storedMessages);
      }
    }
    
    // Initialize the network graph
    function initializeNetworkGraph() {
      console.log("Initializing network graph...");
      const networkGraphContainer = document.getElementById('networkGraphContainer');
      
      if (!networkGraphContainer) {
        console.error('Network graph container not found');
        return;
      }
      
      // Display loading message
      networkGraphContainer.innerHTML = `
        <div style="display: flex; justify-content: center; align-items: center; height: 100%; flex-direction: column;">
          <div style="margin-bottom: 20px;">
            <div class="quantum-spinner" style="width: 50px; height: 50px;">
              <div class="quantum-ring ring-1"></div>
              <div class="quantum-ring ring-2"></div>
              <div class="quantum-ring ring-3"></div>
              <div class="quantum-sphere"></div>
            </div>
          </div>
          <p>Waiting for data to build network graph...</p>
        </div>
      `;
      
      // Initialize the details container
      const detailsContainer = document.getElementById('detailsContainer');
      if (detailsContainer) {
        detailsContainer.innerHTML = `
          <h3 class="network-title">Topic Network Graph</h3>
          <p>This visualization shows relationships between market topics based on how frequently they co-occur in news items.</p>
          <p>No data available yet. Waiting for messages with interpretation tags...</p>
        `;
      }
      
      // Add event listener for reset button
      const resetBtn = document.getElementById('reset-graph-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          console.log("Reset graph button clicked");
          if (storedMessages.length > 0) {
            createNetworkGraph(processNewsData(storedMessages));
          }
        });
      }
      
      // Add event listener for toggle labels button
      const toggleLabelsBtn = document.getElementById('toggle-labels-btn');
      if (toggleLabelsBtn) {
        toggleLabelsBtn.addEventListener('click', () => {
          console.log("Toggle labels button clicked");
          labelsVisible = !labelsVisible;
          
          if (networkGraph && networkGraph.label) {
            networkGraph.label.attr('opacity', labelsVisible ? 1 : 0);
          }
        });
      }
      
      // Force a resize of the container
      setTimeout(() => {
        const container = document.getElementById('networkGraphContainer');
        if (container) {
          console.log("Forcing resize of network graph container");
          if (container.clientHeight < 300) {
            container.style.height = '300px';
          }
          
          // If we already have messages, try to process them
          if (storedMessages.length > 0) {
            updateNetworkGraph(storedMessages);
          }
        }
      }, 500);
    }
    
    // Hook for news messages - this will be our global access point
    window.networkGraphAddMessage = function(message) {
      console.log("Network graph received message:", message.news_id || "unknown");
      
      // Check for interpretation tags in the correct structure
      let hasTags = false;
      try {
        if (message && 
            message.analysis_payload && 
            message.analysis_payload.knowledge_graph_data && 
            message.analysis_payload.knowledge_graph_data.interpretation_tags &&
            Array.isArray(message.analysis_payload.knowledge_graph_data.interpretation_tags) &&
            message.analysis_payload.knowledge_graph_data.interpretation_tags.length > 0) {
          
          hasTags = true;
          console.log("Message has valid interpretation tags:", 
            message.analysis_payload.knowledge_graph_data.interpretation_tags);
        }
      } catch (e) {
        console.warn("Error processing message structure:", e);
      }
      
      if (hasTags) {
        // Check if message is already in storedMessages
        const existingIndex = storedMessages.findIndex(m => m.news_id === message.news_id);
        
        if (existingIndex >= 0) {
          // Replace existing message
          console.log("Replacing existing message in stored collection:", message.news_id);
          storedMessages[existingIndex] = message;
        } else {
          // Add new message
          console.log("Adding new message to stored collection:", message.news_id);
          storedMessages.push(message);
        }
        
        // Always update the graph when a message with tags arrives
        updateNetworkGraph(storedMessages);
      }
    };
    
    // Document ready function
    document.addEventListener('DOMContentLoaded', function() {
      console.log("DOM loaded, setting up network graph...");
      
      // Initialize the network graph
      initializeNetworkGraph();
      
      // Store original function if it exists
      let originalAddNewsMessageToContainer = window.addNewsMessageToContainer;
      
      // Set a timeout to check if necessary functions become available
      setTimeout(() => {
        console.log("Checking for message handling functions...");
        
        // Try to hook into addNewsMessageToContainer if not already done
        if (typeof originalAddNewsMessageToContainer !== 'function' && 
            typeof window.addNewsMessageToContainer === 'function') {
          
          console.log("Found addNewsMessageToContainer, hooking into it...");
          originalAddNewsMessageToContainer = window.addNewsMessageToContainer;
          
          // Override the function
          window.addNewsMessageToContainer = function(message, container, addToTop) {
            // Call the original function
            if (typeof originalAddNewsMessageToContainer === 'function') {
              originalAddNewsMessageToContainer(message, container, addToTop);
            }
            
            // Process the message for our network graph
            if (window.networkGraphAddMessage) {
              window.networkGraphAddMessage(message);
            }
          };
          
          console.log("Successfully hooked into message handling system");
        } else {
          console.warn("Could not find addNewsMessageToContainer function to hook into");
          
          // Try to directly access already loaded messages
          try {
            console.log("Checking for existing messages in news_updater.js...");
            if (window.eventSource && window.eventSource.onmessage) {
              console.log("EventSource found, might be able to access messages");
            }
          } catch (e) {
            console.warn("Error checking for EventSource:", e);
          }
        }
      }, 1000);
    });
  </script>
</body>
