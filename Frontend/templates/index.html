<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Analytica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/index.css" />
  <link rel="stylesheet" href="/static/css/news.css">
  <link rel="stylesheet" href="/static/css/narrative_clusters.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="icon" type="image/jpeg" href="/static/Images/portrait/icon.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="/static/Images/portrait/icon.jpg">
  <link rel="stylesheet" href="/static/css/narrative_clusters.css">
</head>
<body class="dark-theme">
  <canvas id="quantum-field"></canvas>

  <header>
    <div class="header-container">
      <div class="logo-section">
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
          <div class="logo-text">Vortex Analytica</div>
        </div>
      </div>

      <div class="header-right-group">
        <div class="user-info">
          <span class="user-welcome">Hello, 
            <span id="user-display-name"></span>
          </span>
        </div>
        <button class="header-btn" id="feedback-btn">Feedback</button>
        
        <button id="logout-btn" class="logoutButton">
            <span class="button-text">Logout</span>
        </button>
      </div>
    </div>
  </header>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <span style="font-size: 14px; font-weight: 600; color: var(--dark-accent);">Menu</span>
    </div>
    <button class="sidebar-pin-btn" id="sidebar-pin-btn" title="Pin sidebar">
      <i class="fas fa-thumbtack"></i>
    </button>
  </div>
  
  <div class="sidebar-content">
    <ul class="sidebar-menu">
      <li>
        <a href="#" class="active" data-view="feed">
          <i class="fas fa-rss"></i>
          <span class="sidebar-menu-text">Real-time news</span>
          <span class="sidebar-tooltip">Real-time news</span>
        </a>
      </li>
      <li>
        <a href="#" data-view="satellite-analysis">
         <i class="fa-solid fa-satellite"></i>


          <span class="sidebar-menu-text">Satellite Analysis</span>
          <span class="sidebar-tooltip">Satellite Analysis</span>
        </a>
      </li>
      <li>
        <a href="#" data-view="settings">
          <i class="fas fa-cog"></i>
          <span class="sidebar-menu-text">Settings</span>
          <span class="sidebar-tooltip">Settings</span>
        </a>
      </li>
    </ul>
  </div>
  
  <div class="sidebar-footer">
    <div class="sidebar-theme-toggle" id="sidebar-theme-toggle">
      <i class="fas fa-moon" id="theme-icon"></i>
      <span>Dark theme</span>
    </div>
  </div>
</div>

<!-- Add overlay for mobile -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="sidebar-theme-toggle">
      <i class="fa-solid fa-lightbulb"></i>


      <span>Change theme</span>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle-checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main-content" id="contentWrapper">
    <main>
      <div class="view-section active" id="feed-view">
          <!-- News Container on the left side -->
          <div class="news-container"></div>

          <!-- Dashboard Container with ID for narrative clusters -->
          <div class="dashboard-container" id="dashboard-container">

          </div>

      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script type="module" src="/static/js/quantum_bg_no_particles.js"></script>
  <script src="/static/js/index.js"></script>
  <script src="/static/js/news_base.js"></script>
  <script src="/static/js/side_menu.js"></script>
  <script src="/static/js/news_updater.js"></script>
  <script src="/static/js/critical_news.js"></script>
  <script src="/static/js/graph.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
   <script src="/static/js/narrative_clusters.js"></script>
</body>
</html>
